name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  tests:
    name: Run tests
    runs-on: ubuntu-latest
    outputs:
      tests_result: ${{ steps.run_tests.outputs.tests_result }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests (pytest) and set result
        id: run_tests
        run: |
          set +e
          pytest -q --junitxml=tests-report.xml
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "tests_result=success" >> $GITHUB_OUTPUT
          else
            echo "tests_result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests-report.xml

  packaging:
    name: Build package
    runs-on: ubuntu-latest
    outputs:
      build_result: ${{ steps.build_step.outputs.build_result }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pyinstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build with pyinstaller and set result
        id: build_step
        run: |
          set +e
          pyinstaller --onefile main.py --name piadas_chuck
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "build_result=success" >> $GITHUB_OUTPUT
          else
            echo "build_result=failure" >> $GITHUB_OUTPUT
          fi

      - name: Prepare package artifact
        if: always()
        run: |
          mkdir -p out
          if [ -d dist ]; then
            zip -r out/piadas_chuck.zip dist
          else
            # fallback: zip a placeholder so artifact always existe
            echo "dist não gerado" > out/piadas_chuck.zip
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: out/piadas_chuck.zip

  notify:
    name: Notify (email)
    runs-on: ubuntu-latest
    needs: [tests, packaging]
    if: always()
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run notification script
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_SUBJECT: "Pipeline result - ${{ github.workflow }}"
          EMAIL_BODY: |
            Resultados do pipeline:
            - Testes: ${{ needs.tests.outputs.tests_result }}
            - Build: ${{ needs.packaging.outputs.build_result }}
            (Para baixar artefatos: vá ao run do workflow > Artifacts)
        run: |
          python send_email.py
