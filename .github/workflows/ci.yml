name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          pytest --maxfail=1 --disable-warnings -q

  build-package:
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build package
        run: |
          mkdir -p dist
          zip -r dist/app.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-package
          path: dist/app.zip

  send-notification:
    runs-on: ubuntu-latest
    needs: [run-tests, build-package]
    steps:
      - name: Send notification email
        run: |
          curl -s --user "api:${{ secrets.MAILGUN_API_KEY }}" \
            https://api.mailgun.net/v3/${{ secrets.MAILGUN_DOMAIN }}/messages \
            -F from="${{ secrets.MAILGUN_FROM }}" \
            -F to="${{ secrets.RECIPIENT_EMAIL }}" \
            -F subject="CI Pipeline Result" \
            -F text="Pipeline finalizado com sucesso!"
