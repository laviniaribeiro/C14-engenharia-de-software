name: CI pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  actions: read

jobs:
  tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runner (install any system deps)
        run: bash ./scripts/setup_runner.sh

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest and produce JUnit report
        run: |
          . venv/bin/activate
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/junit.xml

  package:
    name: Build/package job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup runner (install any system deps)
        run: bash ./scripts/setup_runner.sh

      - name: Create package (zip)
        run: |
          chmod +x ./scripts/package.sh
          ./scripts/package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/

  notify:
    name: Send notification email
    runs-on: ubuntu-latest
    needs: [tests, package]
    if: always()
    steps:
      - name: Checkout code (for the script)
        uses: actions/checkout@v4

      - name: Send email with pipeline results
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          MAILGUN_FROM: ${{ secrets.MAILGUN_FROM }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./scripts/send_email.sh
          ./scripts/send_email.sh
